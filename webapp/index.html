<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cornelsen Talent Portal — SAP Fiori Enterprise Application">
    <title>Cornelsen Talent Portal</title>
    <style>
        html, body, #content, #content > div[data-sap-ui-component] {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
    <!-- Local UI5 via ui5 serve (required for BAS). Run: npm run start:bas -->
    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.ui.core,sap.ui.layout,sap.uxap,sap.f,sap.ui.unified"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-resourceroots='{"cornelsen.talent.portal": "./"}'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport">
    </script>
</head>
<body class="sapUiBody cornelsenBody" id="content">
    <div
        data-sap-ui-component
        data-name="cornelsen.talent.portal"
        data-id="container"
        data-settings='{"id": "cornelsenTalentPortal"}'
        style="height: 100%">
    </div>
</body>
</html>
