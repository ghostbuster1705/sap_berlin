<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cornelsen Talent Portal</title>
    <style>
        html, body, #content, #content > div[data-sap-ui-component] {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #errorBox {
            display: none;
            padding: 2rem;
            font-family: Arial, sans-serif;
            color: #E30613;
            background: #fff3f3;
            border: 1px solid #E30613;
            margin: 1rem;
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.ui.core,sap.ui.layout,sap.uxap,sap.f,sap.ui.unified,sap.tnt"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-resourceroots='{"cornelsen.talent.portal": "./"}'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-frameOptions="allow">
    </script>
    <script>
        window.addEventListener("error", function (e) {
            var box = document.getElementById("errorBox");
            if (box) {
                box.style.display = "block";
                box.innerHTML = "<b>Fehler beim Laden:</b><br>" + (e.message || e);
            }
        });
    </script>
</head>
<body class="sapUiBody cornelsenBody" id="content">
    <div id="errorBox"></div>
    <div
        data-sap-ui-component
        data-name="cornelsen.talent.portal"
        data-id="container"
        data-settings='{"id": "cornelsenTalentPortal"}'
        style="height: 100%">
    </div>
</body>
</html>
